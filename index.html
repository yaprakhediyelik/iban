<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaprak Tasarım & Hediye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --card-bg: #1c1916;
    --gold: #c9a876;
    --gold-soft: #ad8f66;
    --cream: #f3ede2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Playfair Display', Georgia, serif;
    min-height: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
  }
  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 168px;
    height: 168px;
    background: #fdfdfb;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    margin-bottom: 28px;
    overflow: hidden;
    padding: 12px;
  }
  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 32px;
    color: var(--cream);
  }
  .card {
    width: 100%;
    border: 1px solid var(--gold-soft);
    border-radius: 18px;
    background: var(--card-bg);
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  .card .label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .card .value {
    font-size: 24px;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.35;
    margin-bottom: 18px;
    word-spacing: 2px;
    letter-spacing: 0.5px;
  }
  .card .value.small { font-size: 22px; }
  .copy-btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    background: var(--gold);
    color: #241d12;
  }
  .copy-btn.outline {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--gold-soft);
  }
  .copy-btn.copied { background: #7fae7f; color: #10200f; }
  .section-label {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin: 8px 0 16px;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    border: 1px solid var(--gold-soft);
    border-radius: 16px;
    background: var(--card-bg);
    color: var(--cream);
    text-decoration: none;
    font-size: 19px;
    font-weight: 600;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  a.link-btn:active { transform: scale(0.98); }
  a.link-btn.solid {
    background: var(--gold);
    color: #241d12;
    border-color: var(--gold);
  }
  a.link-btn svg {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    color: var(--gold);
  }
  a.link-btn.solid svg { color: #241d12; }
  .location-card {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    border: 1px solid var(--gold-soft);
    border-radius: 16px;
    background: var(--card-bg);
    margin-top: 22px;
  }
  .location-card svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--gold);
    margin-top: 2px;
  }
  .location-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 4px;
  }
  .location-text {
    font-size: 14px;
    color: #b7b2a7;
    font-family: Georgia, serif;
    line-height: 1.4;
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #6f6a61;
    text-align: center;
  }
</style>
</head>

<script>
function copyText(text, btn, originalLabel) {
  const finish = () => {
    const prev = btn.textContent;
    btn.textContent = 'Kopyalandı ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = originalLabel;
      btn.classList.remove('copied');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(finish);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    finish();
  }
}
</script>
